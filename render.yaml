services:
  - type: web
    name: quarrywatch-krithi-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    dockerCommand: sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quarrywatch-krithi-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://quarrywatch-krithi-web.onrender.com
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: PORT
        value: "10000"
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: quarrywatch-krithi-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    dockerCommand: sh -c 'npm start -- -p ${PORT:-10000}'
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://quarrywatch-krithi-api.onrender.com
      - key: PORT
        value: "10000"

databases:
  - name: quarrywatch-krithi-db
    databaseName: quarry_monitoring
    user: quarry_user
    plan: free
    region: singapore
    postgresMajorVersion: "16"
